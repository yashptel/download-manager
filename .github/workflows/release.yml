# Builds the Windows installer, the macOS disk image and the browser
# extension package. A pushed v* tag also gets a draft release with them;
# publishing it is a manual step. Run it by hand from the Actions tab to just
# build.
#
# Signing is optional and comes from repository secrets:
#   WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD
#       a code-signing certificate as a base64 .pfx and its password
#   APPLE_DEVELOPER_ID_P12_BASE64, APPLE_DEVELOPER_ID_P12_PASSWORD,
#   APPLE_SIGNING_IDENTITY
#       a Developer ID Application certificate as a base64 .p12, its
#       password and its name ("Developer ID Application: …")
#   APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER
#       an App Store Connect API key (the .p8 text, or it in base64), its ID
#       and its issuer ID, for notarization
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    # ARM64 is cross-compiled: the runner has MSVC's ARM64 tools, which Native
    # AOT and the Rust core both link with.
    strategy:
      matrix:
        arch: [x64, arm64]
    env:
      HAS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      # The C# bindings generator takes five minutes to compile; it is pinned,
      # so its build keeps until the pin in build-windows.ps1 changes.
      - uses: actions/cache@v6
        with:
          path: build/tools
          key: uniffi-bindgen-cs-${{ hashFiles('scripts/build-windows.ps1') }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-windows-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Import the signing certificate
        if: env.HAS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE))
          $password = ConvertTo-SecureString $env:PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          "OPENDM_SIGN_CERT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
      - name: Build the installer
        shell: pwsh
        run: scripts/package-windows.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: build/windows/OpenDM-*-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    env:
      HAS_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-macos-${{ hashFiles('Cargo.lock') }}
      - name: Add the Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Import the signing certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          printf '%s' "$CERTIFICATE" | tr -d ' \r\n' | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Prepare notarization
        if: env.HAS_NOTARY_KEY == 'true'
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # The key as pasted from the .p8 file, or that file in base64.
          case "$KEY" in
            *"BEGIN PRIVATE KEY"*) printf '%s\n' "$KEY" > "$RUNNER_TEMP/notary.p8" ;;
            *) printf '%s' "$KEY" | tr -d ' \r\n' | base64 --decode > "$RUNNER_TEMP/notary.p8" ;;
          esac
          echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "NOTARY_ISSUER=$ISSUER" >> "$GITHUB_ENV"
      - name: Build the disk image
        run: scripts/package-macos.sh
      - name: Check the signature and notarization
        if: env.HAS_CERTIFICATE == 'true'
        run: |
          dmg=$(ls build/OpenDM-*.dmg)
          codesign --verify --deep --strict --verbose=2 build/OpenDM.app
          codesign -dv --verbose=2 build/OpenDM.app 2>&1 | grep -E 'Authority|TeamIdentifier|Runtime'
          if [ "$HAS_NOTARY_KEY" = true ]; then
            xcrun stapler validate "$dmg"
            spctl -a -vv -t open --context context:primary-signature "$dmg"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: build/OpenDM-*.dmg
          if-no-files-found: error

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package the extension
        run: python3 scripts/package-extension.py
      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: build/extension/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "OpenDM ${GITHUB_REF_NAME#v}"
