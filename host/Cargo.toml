[package]
name = "opendm-host"
description = "Native messaging host that connects the OpenDM browser extension to the app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "opendm_host"

[[bin]]
name = "opendm-host"
path = "src/main.rs"

[dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std", "net", "time"] }

[dev-dependencies]
tempfile = "3"
