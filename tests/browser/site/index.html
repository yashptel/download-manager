<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Big Buck Test Video</title>
<style>body { font: 15px system-ui; margin: 40px; } video { display: block; margin: 24px 0; background: #111; }</style>
</head>
<body>
  <h1>OpenDM Connect test page</h1>
  <p><a id="zip" href="/files/report.zip">Quarterly report (6 MB zip)</a></p>
  <p><a href="/files/clip.webm">A clip</a></p>
  <video id="video" src="/files/clip.webm" width="560" height="315" muted loop controls></video>
  <!-- A player built as a web component keeps its video in a shadow root and
       names its own playlist in its markup (Reddit). -->
  <shadow-player id="shadow-player" src="/hls2/master.m3u8?f=sd"></shadow-player>
  <script>
    customElements.define("shadow-player", class extends HTMLElement {
      connectedCallback() {
        const root = this.attachShadow({ mode: "open" });
        root.innerHTML = '<div style="position:relative;width:560px;height:315px"><video src="/files/clip.webm" width="560" height="315" muted loop></video><div class="overlay" style="position:absolute;inset:0"></div></div>';
      }
    });
    // What a script player does: ask its API for the video, then load the
    // master playlist and the quality it starts with. Nothing in the page's
    // HTML names the playlist.
    fetch("/api/video.json")
      .then((answer) => answer.json())
      .then((video) => fetch(video.sources.hls))
      .then((answer) => answer.text())
      .then(() => fetch("/hls/720/stream.m3u8"));
    // Tells the test whether OpenDM's page script wrapped fetch in this browser.
    fetch("/log?page-script=" + !/\[native code\]/.test(Function.prototype.toString.call(window.fetch)));
    const auto = new URLSearchParams(location.search).get("auto");
    const link = document.getElementById("zip");
    if (auto === "zip") setTimeout(() => link.click(), 800);
    if (auto === "alt") setTimeout(() => {
      // What an Alt-click looks like to the content script, then the click.
      link.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, altKey: true }));
      link.click();
    }, 800);
  </script>
</body>
</html>
